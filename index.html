        .title-box { display: flex; flex-direction: column; text-align: right !important; }
        .title-box span:first-child { font-size: 11px; font-weight: 800; color: #1a202c; margin-bottom: 2px; letter-spacing: 0px; }
        .title-box span:last-child { font-size: 9px; font-weight: 600; color: #64748b; letter-spacing: 0px; }

        .info-display-wrapper { 
            display: flex; align-items: center; background: #FFFFFF; 
            border: 1px solid #E2E8F0; border-radius: 8px;

        .display-text { font-size: 11px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 5px; flex-direction: row !important; white-space: nowrap; }
        .nav-icon { width: 22px; height: 22px; fill: #1e293b !important; display: block; flex-shrink: 0; }

        .exact-8-spinner {
            position: relative;
            width: 44px;
            height: 44px;
            transform: scale(0.6);
            display: none;
        }
        .exact-8-spinner div {
            position: absolute;
            width: 6px;
            height: 14px;
            background: #666;
            border-radius: 10px;
            left: 19px;
            top: 0;
            transform-origin: 3px 22px;
            animation: spinner-fade 0.8s linear infinite;
        }
        .exact-8-spinner div:nth-child(1) { transform: rotate(0deg); animation-delay: -0.7s; }
        .exact-8-spinner div:nth-child(2) { transform: rotate(45deg); animation-delay: -0.6s; }
        .exact-8-spinner div:nth-child(3) { transform: rotate(90deg); animation-delay: -0.5s; }
        .exact-8-spinner div:nth-child(4) { transform: rotate(135deg); animation-delay: -0.4s; }
        .exact-8-spinner div:nth-child(5) { transform: rotate(180deg); animation-delay: -0.3s; }
        .exact-8-spinner div:nth-child(6) { transform: rotate(225deg); animation-delay: -0.2s; }
        .exact-8-spinner div:nth-child(7) { transform: rotate(270deg); animation-delay: -0.1s; }
        .exact-8-spinner div:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }

        @keyframes spinner-fade {
            0% { background: #ffffff; opacity: 1; }
            100% { background: #666; opacity: 0.3; }
        }

        #media-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            display: none;
        }

        .login-section { padding: 0 10%; background: #F2F1F0; margin-top: -10px; } 
        .login-card {
            background: #ffffff; border-radius: 12px; padding: 30px;
            border: 1px solid #e9ecef;
            max-width: 600px; margin: 0 auto;
        }
        
        .new-section-container {
            display: flex;
            flex-direction: column;
            height: auto;
            width: 100%;
            background-color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .hero-box-empty-new {

            border-bottom-left-radius: 45px;
            border-bottom-right-radius: 45px;

            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 0;
            width: 100%;

        .header-content-new {

            align-items: center;
            justify-content: center;

            font-weight: bold;
            color: #000000;

            margin-bottom: 10px;

        .logo-svg-new { width: 32px; height: 32px; }

        .hero-video-container-new {
            width: 80%;
            height: 250px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            touch-action: pan-y;
            transform: translateZ(0);
        }

        .video-overlay-new {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; background: transparent;
        }

        .video-slide-new {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; transition: opacity 0.4s ease-in-out;
            will-change: opacity;
        }

        .video-slide-new.active { opacity: 1; }
        .hero-video-container-new iframe { width: 100%; height: 100%; border: none; }
        .hero-video-container-new img { width: 100%; height: 100%; object-fit: contain; background-color: transparent; }

        .pagination-dots-new {
            background-color: rgba(0, 0, 0, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            gap: 8px;
            margin: 10px 0;
            z-index: 10;
        }

        .dot-new {
            width: 8px; height: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%; cursor: pointer;
            transition: background-color 0.3s;

        .dot-new.active { background-color: #000000; }

        .hero-text-new {

            font-weight: 500; text-align: center;
            padding: 0 20px;

        .footer-actions-new {
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 30px 40px 30px;
            gap: 15px;
        }

        .btn-new {
            width: 100%; max-width: 480px;
            padding: 18px; border-radius: 16px;
            border: none; font-size: 18px;
            font-weight: 700; cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-sizing: border-box;

            max-width: 320px; margin-top: 15px;

        .legal-new span, .auth-legal-small span {
            text-decoration: underline; font-weight: 600; color: #386E2C !important;
        }

        .selection-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: flex-end;
        }
        
        .selection-sheet {
            width: 100%; max-width: 500px; background: white; border-radius: 24px 24px 0 0; 
            padding: 15px 20px; box-sizing: border-box; max-height: 90vh; overflow-y: auto;
            position: relative;
            direction: rtl;
        }

        .sheet-header {
            display: flex; justify-content: center; align-items: center;
            position: relative; margin-bottom: 20px; padding-top: 5px;

        .sheet-title { font-size: 20px; font-weight: 800; color: #333; }
        
        .close-sheet {

        }

        .section-label {

            margin: 15px 0 12px; text-align: right; width: 100%;

        .options-grid {

            width: 100%; margin-bottom: 20px;

        .option-box {

        }

        .auth-modal {
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #fff; 
            z-index: 10005; 
            flex-direction: column;
            overflow-y: auto;
        }
        .auth-sheet {
            width: 100%; 
            max-width: 480px; 
            margin: 0 auto;
            background: white; 
            padding: 20px; 
            box-sizing: border-box; 
            position: relative;
            text-align: left;

            direction: ltr !important;
            min-height: 100vh;
            display: flex;

            font-size: 18px; outline: none; color: #000;
            font-weight: 400;
            box-sizing: border-box;
        }
        .auth-input::placeholder { color: #9ca3af; }
        
        [dir="rtl"] .auth-input {
            text-align: right;
        }

        .auth-submit-btn {
            width: 100%; padding: 18px; background: var(--primary-green); border: none; border-radius: 12px;
            color: #fff; font-size: 20px; font-weight: 800; margin: 30px 0 15px; cursor: pointer;
            transition: opacity 0.2s;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        
        .auth-submit-btn span { flex: 1; text-align: center; }
        .auth-submit-btn .exact-8-spinner {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%) scale(0.5);
            margin: 0;
        }

        .social-btn {

            background: #f3f4f6; display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 12px; font-weight: 700; cursor: pointer; font-size: 18px;
            color: #000; box-sizing: border-box;
            position: relative;

        .social-btn .google-icon-svg { width: 24px; height: 24px; position: absolute; left: 20px; }

        .auth-footer { margin: 40px 0 20px; color: #6b7280; font-size: 16px; text-align: center; font-weight: 500; }
        
        .auth-footer span { font-weight: 800; color: #386E2C; cursor: pointer; text-decoration: underline; }

        .toggle-password { position: absolute; right: 0; top: 16px; cursor: pointer; color: #374151; }

        .custom-checkbox-wrapper { display: flex; align-items: flex-start; gap: 12px; margin: 25px 0; cursor: pointer; }
        .custom-checkbox { width: 22px; height: 22px; border: 2px solid #000; border-radius: 6px; flex-shrink: 0; margin-top: 2px; position: relative; transition: background 0.2s; }
        .custom-checkbox.checked { background: #000; }
        .custom-checkbox.checked::after { content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 14px; font-weight: 800; }

                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </div>
                <div class="sheet-title" id="sheet-title-label">لغة/منطقة</div>
            </div>

            <div class="section-label" id="lang-section-label">لغة</div>

                <div class="option-box" id="lang-en" onclick="setTempLang('en')"><span>EN</span></div>
                <div class="option-box" id="lang-ar" onclick="setTempLang('ar')"><span>العربية</span></div>
            </div>

            <div class="section-label" id="region-section-label">منطقة</div>

            <button class="save-btn" id="save-btn-label" onclick="applyChanges()">حفظ</button>

    <div id="dialog-overlay" class="custom-dialog-overlay" onclick="closeDialog()">
        <div class="custom-dialog" onclick="event.stopPropagation()">
            <div class="dialog-body">
                <div class="dialog-title" id="dialog-title"></div>
                <div class="dialog-text" id="dialog-text"></div>
            </div>
            <div class="dialog-btn" id="dialog-btn" onclick="closeDialog()"></div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk", 
            authDomain: "serviocmm-a65ed.firebaseapp.com", 
            projectId: "serviocmm-a65ed", 
            storageBucket: "serviocmm-a65ed.firebasestorage.app", 
            messagingSenderId: "975373759034", 
            appId: "1:975373759034:web:645cb5fb48772839453b03" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        async function saveUserToFirestore(user, customName = null) {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const regIdx = parseInt(localStorage.getItem('pref_reg_idx')) || 0;
            const regions_ar = ["الجزائر", "مصر", "العراق", "الأردن", "الشرق الأوسط وشمال أفريقيا", "المغرب", "نيجيريا", "عمان", "فلسطين", "قطر", "السعودية", "الإمارات"];
            const regions_en = ["Algeria", "Egypt", "Iraq", "Jordan", "MENA", "Morocco", "Nigeria", "Oman", "Palestine", "Qatar", "Saudi Arabia", "UAE"];
            
            const currentRegionName = lang === 'ar' ? regions_ar[regIdx] : regions_en[regIdx];
            const currentLanguageName = lang === 'ar' ? "العربية" : "English";

            const userRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(userRef);

            if (!docSnap.exists()) {
                await setDoc(userRef, {
                    name: customName || user.displayName || "User",
                    balance: 0,
                    total_spend: 0,
                    email: user.email,
                    uid: user.uid,
                    selected_region: currentRegionName,
                    selected_language: currentLanguageName
                });
            } else {
                await setDoc(userRef, {
                    selected_region: currentRegionName,
                    selected_language: currentLanguageName
                }, { merge: true });
            }
            window.location.href = "dashboard/";
        }

        window.firebaseLogin = async (email, password) => {
            try {
                const res = await signInWithEmailAndPassword(auth, email, password);
                await saveUserToFirestore(res.user);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.firebaseJoin = async (name, email, password) => {
            try {
                const res = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(res.user, { displayName: name });
                await saveUserToFirestore(res.user, name);
            } catch (e) { alert("Error: " + e.message); }
        };

        window.firebaseGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                await saveUserToFirestore(result.user);
            } catch (e) { alert("Error: " + e.message); }
        };
    </script>

    <script>
        let currentIndexNew = 0;
        const totalSlidesNew = 4;
        const playersNew = [];
        let sliderTimer;
        let isTransitioning = false;
        
        let tempLang = localStorage.getItem('pref_lang') || 'ar';
        let tempRegIdx = parseInt(localStorage.getItem('pref_reg_idx')) || 0;

        const googleIconSvg = `<svg class="google-icon-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>`;

        function handleMainBtnClick(btn, type) {
            const spinner = btn.querySelector('.exact-8-spinner');
            spinner.style.display = 'block';
            setTimeout(() => {
                spinner.style.display = 'none';
                openAuthModal(type);
            }, 800);
        }

        function handleAuthSubmit(btn, type) {
            const spinner = btn.querySelector('.exact-8-spinner');
            spinner.style.display = 'block';
            const email = document.getElementById('auth-email-in')?.value;
            const pass = document.getElementById('auth-pass-in')?.value;
            
            if(type === 'login') {
                window.firebaseLogin(email, pass).finally(() => spinner.style.display = 'none');
            } else {
                const name = document.getElementById('auth-name-in')?.value;
                window.firebaseJoin(name, email, pass).finally(() => spinner.style.display = 'none');
            }
        }

        function togglePassword(icon) {
            const input = icon.parentElement.querySelector('input');
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            
            if (isPassword) {
                icon.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            } else {
                icon.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>`;
            }
        }

        function toggleCheckbox(el) { el.classList.toggle('checked'); }

        function openAuthModal(type) {
            const container = document.getElementById('auth-content');
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const t = {
                ar: { joinTitle: "انضم إلى serviocmm", loginTitle: "تسجيل الدخول", namePlace: "الاسم", emailPlace: "البريد الإلكتروني", passPlace: "كلمة المرور", news: "أوافق على تلقي النشرات الإخبارية وتحديثات المنتجات والعروض الحصرية من serviocmm.", legalJoin: "من خلال الانضمام إلى serviocmm، فإنك توافق على <span>شروط الخدمة</span> وتقر بـ <span>سياسة الخصوصية</span> الخاصة بنا.", legalLogin: "من خلال تسجيل الدخول إلى serviocmm، فإنك توافق على <span>شروط الخدمة</span> وتقر بـ <span>سياسة الخصوصية</span> الخاصة بنا.", joinBtn: "انضم الآن", loginBtn: "تسجيل الدخول", google: "المتابعة باستخدام Google", haveAccount: "لديك حساب؟", noAccount: "ليس لديك حساب؟", forgot: "هل نسيت كلمة المرور؟" },
                en: { joinTitle: "Join serviocmm", loginTitle: "Log in", namePlace: "Name", emailPlace: "Email", passPlace: "Password", news: "I agree to receive newsletters, product updates, and exclusive offers from serviocmm.", legalJoin: "By joining serviocmm, you agree to our <span>Terms of Service</span> and acknowledge our <span>Privacy Policy</span>.", legalLogin: "By logging into serviocmm, you agree to our <span>Terms of Service</span> and acknowledge our <span>Privacy Policy</span>.", joinBtn: "Join", loginBtn: "Log in", google: "Continue with Google", haveAccount: "Have an account?", noAccount: "Don't have an account?", forgot: "Forgot password?" }
            };
            const cur = t[lang];

            if (type === 'join') {
                container.innerHTML = `
                    <div class="auth-title">${cur.joinTitle}</div>
                    <div class="auth-input-group"><input type="text" id="auth-name-in" class="auth-input" placeholder="${cur.namePlace}"></div>
                    <div class="auth-input-group"><input type="email" id="auth-email-in" class="auth-input" placeholder="${cur.emailPlace}"></div>
                    <div class="auth-input-group">
                        <input type="password" id="auth-pass-in" class="auth-input" placeholder="${cur.passPlace}">
                        <div class="toggle-password" onclick="togglePassword(this)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg></div>
                    </div>
                    <div class="custom-checkbox-wrapper" onclick="toggleCheckbox(this.querySelector('.custom-checkbox'))">
                        <div class="custom-checkbox"></div>
                        <div style="font-size:14px; color:#000; line-height:1.4; font-weight:500;">${cur.news}</div>
                    </div>
                    <p class="auth-legal-small">${cur.legalJoin}</p>
                    <button class="auth-submit-btn" onclick="handleAuthSubmit(this, 'join')">
                        <span>${cur.joinBtn}</span>
                        <div class="exact-8-spinner"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
                    </button>
                    <div class="social-btn" onclick="window.firebaseGoogle()">${googleIconSvg} ${cur.google}</div>
                    <div class="auth-footer">${cur.haveAccount} <span onclick="openAuthModal('login')">${cur.loginBtn}</span></div>
                `;
            } else {
                container.innerHTML = `
                    <div class="auth-title">${cur.loginTitle}</div>
                    <div class="auth-input-group"><input type="email" id="auth-email-in" class="auth-input" placeholder="${cur.emailPlace}"></div>
                    <div class="auth-input-group">
                        <input type="password" id="auth-pass-in" class="auth-input" placeholder="${cur.passPlace}">
                        <div class="toggle-password" onclick="togglePassword(this)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg></div>
                    </div>
                    <div style="text-align:inherit; font-size:15px; color:#9ca3af; margin: 15px 0 25px; font-weight:500;">${cur.forgot}</div>
                    <p class="auth-legal-small">${cur.legalLogin}</p>
                    <button class="auth-submit-btn" onclick="handleAuthSubmit(this, 'login')">
                        <span>${cur.loginBtn}</span>
                        <div class="exact-8-spinner"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
                    </button>
                    <div class="social-btn" onclick="window.firebaseGoogle()">${googleIconSvg} ${cur.google}</div>
                    <div class="auth-footer">${cur.noAccount} <span onclick="openAuthModal('join')">${cur.joinBtn}</span></div>
                `;
            }
            document.getElementById('auth-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').style.display = 'none';
            document.body.style.overflow = ''; 
        }

        function initSlider() {
            document.querySelectorAll('iframe[id^="vimeo-new-"]').forEach((iframe, idx) => {
                const player = new Vimeo.Player(iframe);
                playersNew[idx] = player;
                player.on('loaded', () => { document.getElementById('media-loader').style.display = 'none'; });
                player.on('ended', () => { switchVideoNew((idx + 1) % totalSlidesNew); });
                player.on('error', () => { document.getElementById('media-loader').style.display = 'flex'; setTimeout(() => switchVideoNew((idx + 1) % totalSlidesNew), 500); });
            });
            document.querySelectorAll('.video-slide-new img').forEach((img, idx) => {
                img.onerror = () => { document.getElementById('media-loader').style.display = 'flex'; switchVideoNew((currentIndexNew + 1) % totalSlidesNew); };
            });
            switchVideoNew(0);
            startAutoCycle();
        }

        function startAutoCycle() {
            clearInterval(sliderTimer);
            sliderTimer = setInterval(() => { switchVideoNew((currentIndexNew + 1) % totalSlidesNew); }, 7000); 
        }

        function switchVideoNew(index) {
            if (isTransitioning) return;
            isTransitioning = true;
            const loader = document.getElementById('media-loader');
            currentIndexNew = index;
            const slides = document.querySelectorAll('.video-slide-new');
            const dots = document.querySelectorAll('.dot-new');
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            if(slides[index]) slides[index].classList.add('active');
            if(dots[index]) dots[index].classList.add('active');
            let emergencyTimeout = setTimeout(() => { loader.style.display = 'flex'; isTransitioning = false; switchVideoNew((index + 1) % totalSlidesNew); }, 3000);
            if (index < 2) {
                playersNew.forEach((p, i) => {
                    if (i === index && p) { p.play().then(() => { clearTimeout(emergencyTimeout); loader.style.display = 'none'; isTransitioning = false; }).catch(() => {}); } 
                    else if(p) { p.pause().catch(() => {}); p.setCurrentTime(0).catch(() => {}); }
                });
            } else {
                playersNew.forEach(p => { if(p) { p.pause().catch(() => {}); p.setCurrentTime(0).catch(() => {}); } });
                clearTimeout(emergencyTimeout); loader.style.display = 'none'; isTransitioning = false;
            }
        }

        let touchstartXN = 0; let touchendXN = 0;
        const gestureZoneN = document.querySelector('.video-overlay-new');
        gestureZoneN.addEventListener('touchstart', e => { touchstartXN = e.changedTouches[0].screenX; }, {passive: true});
        gestureZoneN.addEventListener('touchend', e => { touchendXN = e.changedTouches[0].screenX; handleGestureN(); startAutoCycle(); }, {passive: true});
        
        function handleGestureN() {
            if (touchendXN < touchstartXN - 50) switchVideoNew((currentIndexNew + 1) % totalSlidesNew);
            if (touchendXN > touchstartXN + 50) switchVideoNew((currentIndexNew - 1 + totalSlidesNew) % totalSlidesNew);
        }

        const mdiGlobe = `<svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M11,19.93c-3.95-0.49-7-3.85-7-7.93 c0-0.62,0.08-1.21,0.21-1.79L9,15v1c0,1.1,0.9,2,2,2V19.93z M17.9,17.39c-0.26-0.81-1-1.39-1.9-1.39h-1v-3c0-0.55-0.45-1-1-1H8v-2h2 c0.55,0,1-0.45,1-1V7h2c1.1,0,2-0.9,2-2v-0.41c2.93,1.19,5,4.06,5,7.41C20,14.08,19.2,15.97,17.9,17.39z"/></svg>`;
        const regionConfigs = [
            { id: 'algeria', ar: "الجزائر", en: "Algeria", flag: 'https://flagcdn.com/dz.svg' },
            { id: 'egypt', ar: "مصر", en: "Egypt", flag: 'https://flagcdn.com/eg.svg' },
            { id: 'iraq', ar: "العراق", en: "Iraq", flag: 'https://flagcdn.com/iq.svg' },
            { id: 'jordan', ar: "الأردن", en: "Jordan", flag: 'https://flagcdn.com/jo.svg' },
            { id: 'mena', ar: "الشرق الأوسط وشمال أفريقيا", en: "MENA", type: 'icon', svg: mdiGlobe },
            { id: 'morocco', ar: "المغرب", en: "Morocco", flag: 'https://flagcdn.com/ma.svg' },
            { id: 'nigeria', ar: "نيجيريا", en: "Nigeria", flag: 'https://flagcdn.com/ng.svg' },
            { id: 'oman', ar: "عمان", en: "Oman", flag: 'https://flagcdn.com/om.svg' },
            { id: 'palestine', ar: "فلسطين", en: "Palestine", flag: 'https://flagcdn.com/ps.svg' },
            { id: 'qatar', ar: "قطر", en: "Qatar", flag: 'https://flagcdn.com/qa.svg' },
            { id: 'saudi', ar: "السعودية", en: "Saudi Arabia", flag: 'https://flagcdn.com/sa.svg' },
            { id: 'uae', ar: "الإمارات", en: "UAE", flag: 'https://flagcdn.com/ae.svg' }
        ];

        function openSelection() { tempLang = localStorage.getItem('pref_lang') || 'ar'; tempRegIdx = parseInt(localStorage.getItem('pref_reg_idx')) || 0; renderSheet(); document.getElementById('overlay').style.display = 'flex'; }
        function closeSelection() { document.getElementById('overlay').style.display = 'none'; }
        function setTempLang(l) { tempLang = l; renderSheet(); }
        function setTempReg(i) { tempRegIdx = i; renderSheet(); }

        function renderSheet() {
            const container = document.getElementById('regions-grid-container');
            container.innerHTML = '';
            document.getElementById('lang-en').className = tempLang === 'en' ? 'option-box selected' : 'option-box';
            document.getElementById('lang-ar').className = tempLang === 'ar' ? 'option-box selected' : 'option-box';
            regionConfigs.forEach((reg, i) => {
                const box = document.createElement('div');
                box.className = i === tempRegIdx ? 'option-box selected' : 'option-box';
                box.onclick = () => setTempReg(i);
                let icon = reg.type === 'icon' ? reg.svg : `<img src="${reg.flag}">`;
                box.innerHTML = `<span>${reg[tempLang]}</span>` + icon;
                container.appendChild(box);
            });
            const labels = { ar: { title: "لغة/منطقة", lang: "لغة", reg: "منطقة", save: "حفظ" }, en: { title: "Language/Region", lang: "Language", reg: "Region", save: "Save" } };
            document.getElementById('sheet-title-label').innerText = labels[tempLang].title;
            document.getElementById('lang-section-label').innerText = labels[tempLang].lang;
            document.getElementById('region-section-label').innerText = labels[tempLang].reg;
            document.getElementById('save-btn-label').innerText = labels[tempLang].save;
        }

        function applyChanges() {
            closeSelection();
            document.getElementById('global-spinner-overlay').style.display = 'flex';
            setTimeout(() => {
                localStorage.setItem('pref_lang', tempLang);
                localStorage.setItem('pref_reg_idx', tempRegIdx);
                updateUI();
                document.getElementById('global-spinner-overlay').style.display = 'none';
            }, 1500);
        }

        function updateUI() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const regIdx = parseInt(localStorage.getItem('pref_reg_idx')) || 0;
            const reg = regionConfigs[regIdx];
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('label-lng').innerText = lang.toUpperCase();
            document.getElementById('label-reg').innerText = reg[lang];
            document.getElementById('separator-bar').style.display = 'inline';
            document.getElementById('flag-display').innerHTML = reg.type === 'icon' ? reg.svg : `<img src="${reg.flag}" class="nav-icon" style="width:24px; height:16px; border-radius:2px; object-fit:cover;" decoding="async">`;
            const translations = { ar: { hero: "المنصة الأكبر للمتابعين والخدمات في الشرق الأوسط", join: "انضم مجاناً", login: "تسجيل الدخول", legal: "باستخدام تطبيق serviocmm، فإنك توافق على <span>شروط الخدمة</span> وتقر بـ <span>سياسة الخصوصية</span> الخاصة بنا." }, en: { hero: "The Largest Platform for Followers & Services in MENA", join: "Join for free", login: "Log in", legal: "By using the serviocmm app, you agree to our <span>Terms of Service</span> and acknowledge our <span>Privacy Policy</span>." } };
            document.getElementById('hero-text-label').innerText = translations[lang].hero;
            document.querySelector('#btn-join-label span').innerText = translations[lang].join;
            document.querySelector('#btn-login-label span').innerText = translations[lang].login;
            document.getElementById('legal-label').innerHTML = translations[lang].legal;
            if (document.getElementById('auth-modal').style.display === 'flex') {
                const isJoin = document.querySelector('.auth-title').innerText.includes('Join') || document.querySelector('.auth-title').innerText.includes('انضم');
                openAuthModal(isJoin ? 'join' : 'login');
            }
        }

        function closeDialog() { document.getElementById('dialog-overlay').style.display = 'none'; }
        updateUI();
        initSlider();
    </script>
