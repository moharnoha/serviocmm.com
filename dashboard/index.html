<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>serviocmm - Final Version</title>
    <link rel="preconnect" href="https://player.vimeo.com">
    <link rel="preconnect" href="https://i.postimg.cc">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --header-green: #FFFFFF; 
            --login-bg: #386E2C; 
            --google-section-bg: #EAF0E9; 
            --platform-bg: #F2F1F0;
            --garena-red: #386E2C;
            --success-green: #22c55e;
            --primary-green: #2F5822;
        }

        body { 
            margin: 0; padding: 0; 
            font-family: 'Cairo', 'Inter', sans-serif; 
            background-color: #F2F1F0; 
            min-height: 100vh;
            display: flex; flex-direction: column;
            direction: rtl !important; 
        }

        .mobile-container { 
            width: 100%; 
            min-height: 100vh; 
            display: flex; flex-direction: column; 
            position: relative;
            flex-grow: 1;
        }

        header { 
            width: 100%; height: 70px; 
            background-color: var(--header-green); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 15px;
            box-sizing: border-box;
            position: sticky; 
            top: 0; z-index: 1000;
            direction: rtl !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header-content {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (min-width: 481px) {
            .header-content {
                max-width: 100%;
                padding: 0 40px;
            }
        }

        .brand-section { display: flex; align-items: center; flex-direction: row !important; }
        .logo-img { height: 35px; width: auto; display: block; }
        .v-line { width: 1px; height: 30px; background-color: rgba(0,0,0,0.1); margin: 0 12px; }
        
        .title-box { display: flex; flex-direction: column; text-align: right !important; }
        .title-box span { font-family: 'Cairo', 'Inter', sans-serif; letter-spacing: 0px; display: block; }
        .title-box span:first-child { font-size: 11px; font-weight: 800; color: #1a202c; margin-bottom: 0px; }
        .title-box span:last-child { font-size: 11px; font-weight: 800; color: #1a202c; }

        .info-display-wrapper { 
            display: flex; align-items: center; background: #FFFFFF; 
            border: 1px solid #E2E8F0; border-radius: 8px; 
            padding: 0 10px; height: 40px; cursor: default;
            box-sizing: border-box; gap: 8px; flex-direction: row !important;
        }
        .display-text { font-size: 11px; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 5px; flex-direction: row !important; white-space: nowrap; }
        .nav-icon { width: 22px; height: 22px; fill: #1e293b !important; display: block; flex-shrink: 0; }

        .exact-8-spinner {
            position: relative;
            width: 44px;
            height: 44px;
            transform: scale(0.6);
            display: none;
        }
        .exact-8-spinner div {
            position: absolute;
            width: 6px;
            height: 14px;
            background: #666;
            border-radius: 10px;
            left: 19px;
            top: 0;
            transform-origin: 3px 22px;
            animation: spinner-fade 0.8s linear infinite;
        }
        .exact-8-spinner div:nth-child(1) { transform: rotate(0deg); animation-delay: -0.7s; }
        .exact-8-spinner div:nth-child(2) { transform: rotate(45deg); animation-delay: -0.6s; }
        .exact-8-spinner div:nth-child(3) { transform: rotate(90deg); animation-delay: -0.5s; }
        .exact-8-spinner div:nth-child(4) { transform: rotate(135deg); animation-delay: -0.4s; }
        .exact-8-spinner div:nth-child(5) { transform: rotate(180deg); animation-delay: -0.3s; }
        .exact-8-spinner div:nth-child(6) { transform: rotate(225deg); animation-delay: -0.2s; }
        .exact-8-spinner div:nth-child(7) { transform: rotate(270deg); animation-delay: -0.1s; }
        .exact-8-spinner div:nth-child(8) { transform: rotate(315deg); animation-delay: 0s; }

        @keyframes spinner-fade {
            0% { background: #ffffff; opacity: 1; }
            100% { background: #666; opacity: 0.3; }
        }

        #global-spinner-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.7); z-index: 10002; justify-content: center; align-items: center;
        }

        .selection-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: flex-end;
        }
        
        .selection-sheet {
            width: 100%; max-width: 500px; background: white; border-radius: 24px 24px 0 0; 
            padding: 15px 20px; box-sizing: border-box; max-height: 90vh; overflow-y: auto;
            position: relative;
            direction: rtl;
        }

        .sheet-header {
            display: flex; justify-content: center; align-items: center;
            position: relative; margin-bottom: 20px; padding-top: 5px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .sheet-title { font-size: 20px; font-weight: 800; color: #333; }
        
        .close-sheet {
            position: absolute; right: 0; cursor: pointer;
            width: 24px; height: 24px; color: #333;
        }

        .section-label {
            font-size: 16px; font-weight: 700; color: #333;
            margin: 15px 0 12px; text-align: right; width: 100%;
        }

        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            width: 100%; margin-bottom: 20px;
        }

        .option-box {
            background: #fff; border: 1px solid #d1d5db; border-radius: 8px;
            padding: 10px 12px; display: flex; align-items: center; justify-content: flex-end;
            gap: 10px; cursor: pointer; transition: all 0.2s;
            font-size: 16px; font-weight: 600; min-height: 52px;
            box-sizing: border-box; color: #4b5563;
        }

        .option-box.selected { border: 2.5px solid #386E2C; color: #386E2C; }
        .option-box img, .option-box .nav-icon { width: 28px; height: 20px; object-fit: cover; border-radius: 2px; }
        .option-box .nav-icon { width: 22px; height: 22px; color: inherit; }

        .save-btn {
            width: 100%; background: #386E2C; color: white;
            padding: 16px; border-radius: 8px; border: none;
            font-size: 22px; font-weight: 800; cursor: pointer;
            margin-top: 10px; margin-bottom: 15px;
        }
    </style>
</head>
<body class="notranslate">

    <div id="global-spinner-overlay">
        <div class="exact-8-spinner" style="display: block; transform: scale(1);">
            <div></div><div></div><div></div><div></div>
            <div></div><div></div><div></div><div></div>
        </div>
    </div>

    <div class="mobile-container">
        <header>
            <div class="header-content">
                <div class="brand-section">
                    <svg class="logo-img" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" style="height: 35px; width: auto;">
                        <defs>
                            <linearGradient id="deepGreenHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#2d5a1e;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#1a3611;stop-opacity:1" />
                            </linearGradient>
                            <linearGradient id="vibrantGreenHeader" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#74a367;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#5a854f;stop-opacity:1" />
                            </linearGradient>
                            <mask id="whiteGapHeader">
                                <rect width="1000" height="800" fill="white" />
                                <circle cx="350" cy="400" r="362" fill="black" />
                            </mask>
                        </defs>
                        <circle cx="350" cy="400" r="350" fill="url(#deepGreenHeader)" />
                        <circle cx="650" cy="400" r="350" fill="url(#vibrantGreenHeader)" mask="url(#whiteGapHeader)" fill-opacity="0.95" />
                        <g transform="rotate(-38 500 400)">
                            <rect x="290" y="390" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                            <rect x="425" y="80" width="155" height="640" rx="77.5" fill="#FFFFFF" />
                            <rect x="640" y="445" width="75" height="145" rx="37.5" fill="#FFFFFF" />
                        </g>
                    </svg>
                    <div class="v-line"></div>
                    <div class="title-box" id="header-dynamic-title">
                        <span style="text-align: inherit !important;">مركز الخدمات</span>
                        <span style="text-align: inherit !important;">الرقمية</span>
                    </div>
                </div>
                <div class="header-left-group">
                    <div class="info-display-wrapper">
                        <div id="flag-display"></div>
                        <div class="display-text">
                            <span id="label-reg">...</span>
                            <span id="separator-bar" style="opacity:0.3; display:none;">|</span>
                            <span id="label-lng">...</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="content-sections-wrapper" style="flex-grow: 1;"></div>
    </div>

    <div id="overlay" class="selection-overlay">
        <div class="selection-sheet">
            <div class="sheet-header">
                <div class="sheet-title" id="sheet-title-label">لغة/منطقة</div>
            </div>
            <div class="section-label" id="lang-section-label">لغة</div>
            <div class="options-grid" id="lang-options"></div>
            <div class="section-label" id="region-section-label">منطقة</div>
            <div class="options-grid" id="regions-grid-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBYNRiMneaU-d6FPMbCnjcWQBX4Tdg50zk", 
            authDomain: "serviocmm-a65ed.firebaseapp.com", 
            projectId: "serviocmm-a65ed", 
            storageBucket: "serviocmm-a65ed.firebasestorage.app", 
            messagingSenderId: "975373759034", 
            appId: "1:975373759034:web:645cb5fb48772839453b03" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const mdiGlobe = `<svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2C6.48,2,2,6.48,2,12s4.48,10,10,10s10-4.48,10-10S17.52,2,12,2z M11,19.93c-3.95-0.49-7-3.85-7-7.93 c0-0.62,0.08-1.21,0.21-1.79L9,15v1c0,1.1,0.9,2,2,2V19.93z M17.9,17.39c-0.26-0.81-1-1.39-1.9-1.39h-1v-3c0-0.55-0.45-1-1-1H8v-2h2 c0.55,0,1-0.45,1-1V7h2c1.1,0,2-0.9,2-2v-0.41c2.93,1.19,5,4.06,5,7.41C20,14.08,19.2,15.97,17.9,17.39z"/></svg>`;
        const regionConfigs = [
            { id: 'algeria', ar: "الجزائر", en: "Algeria", flag: 'https://flagcdn.com/dz.svg' },
            { id: 'egypt', ar: "مصر", en: "Egypt", flag: 'https://flagcdn.com/eg.svg' },
            { id: 'iraq', ar: "العراق", en: "Iraq", flag: 'https://flagcdn.com/iq.svg' },
            { id: 'jordan', ar: "الأردن", en: "Jordan", flag: 'https://flagcdn.com/jo.svg' },
            { id: 'mena', ar: "الشرق الأوسط", en: "MENA", type: 'icon', svg: mdiGlobe },
            { id: 'morocco', ar: "المغرب", en: "Morocco", flag: 'https://flagcdn.com/ma.svg' },
            { id: 'nigeria', ar: "نيجيريا", en: "Nigeria", flag: 'https://flagcdn.com/ng.svg' },
            { id: 'oman', ar: "عمان", en: "Oman", flag: 'https://flagcdn.com/om.svg' },
            { id: 'palestine', ar: "فلسطين", en: "Palestine", flag: 'https://flagcdn.com/ps.svg' },
            { id: 'qatar', ar: "قطر", en: "Qatar", flag: 'https://flagcdn.com/qa.svg' },
            { id: 'saudi', ar: "السعودية", en: "Saudi Arabia", flag: 'https://flagcdn.com/sa.svg' },
            { id: 'uae', ar: "الإمارات", en: "UAE", flag: 'https://flagcdn.com/ae.svg' }
        ];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const fireLang = (userData.selected_language === "العربية") ? "ar" : "en";
                    const fireRegName = userData.selected_region;
                    
                    const regIdx = regionConfigs.findIndex(r => r.ar === fireRegName || r.en === fireRegName);
                    
                    localStorage.setItem('pref_lang', fireLang);
                    localStorage.setItem('pref_reg_idx', regIdx !== -1 ? regIdx : 0);
                    updateUI();
                }
            }
        });

        function updateUI() {
            const lang = localStorage.getItem('pref_lang') || 'ar';
            const regIdx = parseInt(localStorage.getItem('pref_reg_idx')) || 0;
            const reg = regionConfigs[regIdx];
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('label-lng').innerText = lang.toUpperCase();
            document.getElementById('label-reg').innerText = reg[lang];
            document.getElementById('separator-bar').style.display = 'inline';
            document.getElementById('flag-display').innerHTML = reg.type === 'icon' ? reg.svg : `<img src="${reg.flag}" class="nav-icon" style="width:24px; height:16px; border-radius:2px; object-fit:cover;" decoding="async">`;
            
            const headerBox = document.getElementById('header-dynamic-title');
            if(lang === 'ar') {
                headerBox.innerHTML = `<span>مركز الخدمات</span><span>الرقمية</span>`;
            } else {
                headerBox.innerHTML = `<span>Digital Services</span><span>Center</span>`;
            }
        }
        updateUI();
    </script>
</body>
</html>
